<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEACHER AUS SCIENCE LAB — Page Embed</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #f3f7fc; }
  body { overflow-x: hidden; }
  #scienceView { display: block; width: 100%; height: 1000px; border: 0; background: #f3f7fc; }
  #status { padding: 18px; font: 15px/1.5 Arial, sans-serif; color: #173b46; }
</style>
</head>
<body>
<div id="status">Loading selected Science Lab page…</div>
<iframe id="scienceView" title="Selected TEACHER AUS SCIENCE LAB page" src="./index.html"></iframe>
<script>
(() => {
  const frame = document.getElementById('scienceView');
  const status = document.getElementById('status');
  const params = new URLSearchParams(window.location.search);
  const allowed = new Set(['home', 'curriculum', 'year', 'topic', 'videos', 'lab', 'quiz', 'uasa', 'resources', 'about']);
  const requestedPage = params.get('page') || 'home';
  const page = allowed.has(requestedPage) ? requestedPage : 'home';
  const year = Math.min(6, Math.max(1, Number.parseInt(params.get('year') || '1', 10) || 1));
  const cat = Math.min(5, Math.max(0, Number.parseInt(params.get('cat') || '0', 10) || 0));

  function configure() {
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!doc || typeof win.go !== 'function') throw new Error('Prototype script not ready');

      // Render exactly the page requested by the Google Sites embed URL.
      if (page === 'year') win.go('year', { year });
      else if (page === 'topic') win.go('topic', { year, cat });
      else win.go(page);

      // Remove global navigation so each Google Sites page displays only its own content.
      const style = doc.createElement('style');
      style.id = 'google-sites-single-page-style';
      style.textContent = `
        .topbar, #sidebar, #overlay, footer.footer { display: none !important; }
        .layout { display: block !important; grid-template-columns: 1fr !important; min-height: 0 !important; }
        .content { width: 100% !important; max-width: none !important; margin: 0 !important; padding: clamp(12px, 2.5vw, 28px) !important; }
        html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; overflow-x: hidden !important; }
        .hero { margin-top: 0 !important; }
      `;
      doc.head.appendChild(style);

      // Keep in-content links from swapping to another prototype section inside this embed.
      // Those sections are intended to live on their own Google Sites pages.
      doc.querySelectorAll('#mainContent [data-page], #mainContent [data-action], #mainContent [data-year], #mainContent [data-cat]').forEach(el => {
        el.removeAttribute('data-page');
        el.removeAttribute('data-action');
        el.removeAttribute('data-year');
        el.removeAttribute('data-cat');
      });

      const titleMap = {
        home: 'Home', curriculum: 'Standard-Based Curriculum Design', year: `Year ${year}`,
        topic: `Year ${year} — ${['Inquiry in Science','Life Science','Physical Science','Material Science','Earth and Space','Technology and Sustainability'][cat]}`,
        videos: 'Science Videos', lab: 'Science Lab', quiz: 'Quiz Zone', uasa: 'UASA Practice', resources: 'Resource Centre', about: 'About Teacher Aus'
      };
      document.title = 'TEACHER AUS SCIENCE LAB — ' + titleMap[page];
      status.remove();

      const resize = () => {
        try {
          const d = frame.contentDocument;
          const height = Math.max(650, d.documentElement.scrollHeight, d.body.scrollHeight);
          frame.style.height = height + 'px';
        } catch (_) {}
      };
      resize();
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(doc.body);
      window.addEventListener('resize', resize);
      setTimeout(resize, 250);
      setTimeout(resize, 900);
    } catch (err) {
      status.textContent = 'Could not load the selected page. Check that index.html is published in the same GitHub Pages folder.';
    }
  }
  frame.addEventListener('load', configure);
})();
</script>
</body>
</html>
