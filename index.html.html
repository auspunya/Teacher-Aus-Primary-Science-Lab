<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEACHER AUS SCIENCE LAB</title>
<style>
:root{--navy:#112c47;--blue:#087cb8;--mint:#d9f99d;--teal:#2d8b88;--ink:#173b46;--muted:#647b82;--paper:#f3f7fc;--white:#fff;--line:#dce9e7;--yellow:#fde68a;--lilac:#f0e4ff;--sky:#dceefe;--green:#ddf5e7}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,Helvetica,sans-serif}
button,a{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;box-shadow:0 3px 14px #123b4a22}.brandmark{width:42px;height:42px;border-radius:13px;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-size:23px}.brand{font-weight:800;letter-spacing:.4px;line-height:1.15}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#dff6ef;margin-top:4px}.menu-btn{background:transparent;border:1px solid #ffffff66;color:white;border-radius:10px;padding:7px 11px}.top-actions{margin-left:auto;display:flex;gap:8px}.layout{display:grid;grid-template-columns:265px 1fr;min-height:calc(100vh - 66px)}aside{background:#087cb8;color:white;padding:18px 12px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#d3edf8;padding:12px 12px 5px}.nav-item,.year-toggle,.subnav button{width:100%;border:0;background:transparent;color:white;text-align:left;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}.nav-item:hover,.year-toggle:hover,.subnav button:hover,.nav-item.active,.subnav button.active{background:#ffffff25}.year-toggle{font-weight:700}.chev{margin-left:auto}.subnav{padding-left:15px;display:none}.subnav.open{display:block}.subnav button{font-size:13px;padding:8px 10px}.content{padding:24px;max-width:1300px;width:100%;margin:auto}.hero{background:#112c47;color:#fff;border:1px solid #1c4565;border-radius:24px;padding:clamp(20px,4vw,32px);position:relative;overflow:hidden}.hero h1{color:#fff}.hero p{color:#dce8f2}.hero .eyebrow{background:#d9f99d;color:#112c47}.hero .hero-banner{width:100%;height:clamp(210px,36vw,380px);object-fit:cover;object-position:center 43%;display:block;border-radius:14px;margin:22px 0 18px}.hero .hero-art{display:none}.hero .hero-divider{height:1px;background:#ffffff42;margin:18px 0}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#d8f1ed;color:#287b7b;border-radius:999px;padding:7px 13px;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(36px,5vw,64px);line-height:1.05;letter-spacing:-1.5px;margin:22px 0 12px;color:var(--navy)}.hero h1 span{color:var(--teal)}.hero p{max-width:750px;color:#526f77;font-size:18px}.hero-art{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:28px 0 10px}.bubble{background:#ffffffbd;border:1px solid white;border-radius:20px;padding:14px 18px;box-shadow:0 12px 25px #1746530b;font-size:30px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 17px;font-weight:700;text-decoration:none;background:var(--navy);color:white}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.btn.mint{background:var(--mint);color:var(--navy)}.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.section{margin:34px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.section-head h2{margin:0;font-size:clamp(23px,3vw,32px);color:var(--navy)}.section-head p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 24px #123b4a07}.card h3{margin:8px 0 5px;color:var(--navy)}.card p{margin:5px 0;color:var(--muted);font-size:14px}.iconbox{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:var(--sky)}.pill{display:inline-block;border-radius:999px;background:#e6f5ef;color:#24745f;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.5px}.year-card{cursor:pointer;transition:transform .15s,border-color .15s}.year-card:hover{transform:translateY(-3px);border-color:#8acbc4}.year-top{display:flex;justify-content:space-between;align-items:center}.year-number{font-size:32px;font-weight:900;color:var(--teal)}.mini-link{border:0;background:#edf7f6;color:#245c62;border-radius:9px;padding:8px 10px;font-weight:700}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:stretch}.flow-card{position:relative;border-radius:18px;padding:18px 14px;min-height:165px;border:1px solid #ffffff;background:white;box-shadow:0 9px 20px #123b4a0a}.flow-card:not(:last-child):after{content:"→";position:absolute;right:-15px;top:44%;font-size:24px;font-weight:900;color:#4eaaa1;z-index:2}.flow-card .num{font-size:12px;font-weight:900;letter-spacing:1px;color:#557780}.flow-card .flow-icon{font-size:27px}.flow-card h3{font-size:16px;line-height:1.25;margin:9px 0 6px}.flow-card p{font-size:12px;color:var(--muted);margin:0}.flow-card:nth-child(1){background:#dceefe}.flow-card:nth-child(2){background:#ddf5e7}.flow-card:nth-child(3){background:#fff0c7}.flow-card:nth-child(4){background:#f0e4ff}.flow-card:nth-child(5){background:#d7efed}.example{background:#123b4a;color:white;border-radius:22px;padding:24px}.example h3{color:#fde68a;margin-top:0}.example p{color:#d8e9e9}.example-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.example-step{background:#ffffff16;border:1px solid #ffffff18;border-radius:13px;padding:13px;font-size:13px}.example-step b{display:block;color:#d9f99d;margin-bottom:5px}.topic-header{background:linear-gradient(120deg,#123b4a,#1d6976);color:white;border-radius:24px;padding:28px;margin-bottom:20px}.topic-header h1{margin:8px 0;font-size:38px}.topic-header p{color:#d6e8e9}.resource-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.resource{display:flex;gap:12px;align-items:flex-start;background:white;border:1px solid var(--line);padding:16px;border-radius:15px}.resource .emoji{font-size:25px}.resource h4{margin:0 0 4px}.resource p{font-size:13px;color:var(--muted);margin:0}.note{border-left:4px solid var(--teal);padding:12px 15px;background:#eaf7f4;border-radius:0 12px 12px 0;margin:16px 0}.quiz-option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;padding:12px 14px;border-radius:12px;margin:8px 0}.quiz-option:hover{border-color:var(--teal);background:#f3fbf9}.quiz-feedback{margin-top:12px;font-weight:700}.searchbox{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;margin:12px 0 20px;font:inherit}.footer{margin-top:40px;padding:24px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}.hidden{display:none!important}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#fff0c7;color:#75530a;font-size:11px;font-weight:800}.mobile-overlay{display:none}

.lab-scene{height:100%;min-height:210px;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(180deg,#f8d9ad 0%,#f9edce 52%,#bdc7bd 53%,#927c69 100%);display:flex;align-items:flex-end;justify-content:center;gap:clamp(5px,2vw,22px);padding:0 4% 7%;isolation:isolate}
.lab-scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#345e6b55,transparent 25%,transparent 70%,#ffffff33),repeating-linear-gradient(90deg,transparent 0 18%,#ffffff50 18.5% 19.5%,transparent 20% 35%);z-index:-1}
.lab-scene .window{position:absolute;right:9%;top:0;width:42%;height:58%;background:linear-gradient(135deg,#fff7db,#f8c879);border:10px solid #f5f0df;border-bottom-width:14px;box-shadow:0 0 25px #fff9}
.solar-poster,.plant-poster{position:absolute;top:7%;background:#f3f5e8;color:#315c63;border-radius:4px;padding:9px 10px;font-size:clamp(10px,1.5vw,16px);box-shadow:0 3px 8px #4d514b33;text-align:center}.solar-poster{left:4%;transform:rotate(-2deg)}.plant-poster{right:4%;transform:rotate(2deg)}.solar-poster small,.plant-poster small{font-size:9px;font-weight:bold;letter-spacing:1px}
.teacher{position:relative;z-index:2;font-size:clamp(42px,7vw,80px);filter:drop-shadow(0 4px 3px #5555);margin-bottom:3%;text-align:center}.teacher small{display:block;font-size:9px;letter-spacing:1px;background:#fff;color:#36545a;border-radius:8px;padding:2px 5px}
.pupil{position:relative;z-index:2;font-size:clamp(35px,6vw,68px);filter:drop-shadow(0 4px 3px #5555);margin-bottom:2%}.p1{transform:rotate(-5deg)}.p2{transform:scale(1.12)}.p3{transform:rotate(4deg)}.p4{transform:rotate(-3deg)}
.bench{position:absolute;bottom:0;left:0;right:0;height:22%;background:linear-gradient(#b58a62,#79543c);z-index:1;box-shadow:0 -5px 12px #6b4c3433}.microscope{position:absolute;z-index:3;bottom:11%;left:32%;font-size:clamp(32px,6vw,66px);filter:drop-shadow(0 3px 3px #3335)}.beaker{position:absolute;z-index:3;bottom:9%;font-size:clamp(22px,4vw,42px)}.b1{left:15%}.b2{right:16%}


/* High-definition, colorful interactive UI layer */
body{background:radial-gradient(circle at 8% 12%,#e1f7f2 0,transparent 26%),radial-gradient(circle at 92% 28%,#e7eaff 0,transparent 25%),#f6f8fc}
.card{position:relative;overflow:hidden;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;box-shadow:0 10px 28px rgba(17,44,71,.075)}
.card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#39c6c1,#83e0ac,#b6a4ff,#ffc66d);opacity:.9}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(17,44,71,.15);border-color:#9ddbd7}
.card .iconbox{box-shadow:inset 0 1px 0 #ffffffbd,0 5px 12px #123b4a0b;transition:transform .2s ease}
.card:hover .iconbox{transform:scale(1.07) rotate(-3deg)}
.year-card:nth-child(6n+1){background:linear-gradient(145deg,#fff,#e8f4ff)}
.year-card:nth-child(6n+2){background:linear-gradient(145deg,#fff,#e4fbef)}
.year-card:nth-child(6n+3){background:linear-gradient(145deg,#fff,#fff4d8)}
.year-card:nth-child(6n+4){background:linear-gradient(145deg,#fff,#f2eaff)}
.year-card:nth-child(6n+5){background:linear-gradient(145deg,#fff,#e0f8f8)}
.year-card:nth-child(6n){background:linear-gradient(145deg,#fff,#ffe9e6)}
.year-card .year-number{text-shadow:0 4px 12px #2d8b8822}
.btn{box-shadow:0 7px 15px #123b4a22;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 11px 22px #123b4a2c}
.btn:active,.mini-link:active,.nav-item:active{transform:scale(.98)}
.mini-link{transition:background .18s ease,color .18s ease,transform .18s ease}
.mini-link:hover{background:#c9f1e7;color:#104e54;transform:translateX(2px)}
.nav-item,.year-toggle,.subnav button{transition:background .18s ease,transform .18s ease}
.nav-item:hover,.year-toggle:hover,.subnav button:hover{transform:translateX(2px)}
.flow-card{transition:transform .2s ease,box-shadow .2s ease;border:1px solid #ffffffd9}
.flow-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 16px 30px #123b4a18}
.flow-card:nth-child(1){background:linear-gradient(145deg,#e7f3ff,#cde6ff)}
.flow-card:nth-child(2){background:linear-gradient(145deg,#e8fff0,#c9f3d9)}
.flow-card:nth-child(3){background:linear-gradient(145deg,#fff8df,#ffe8a7)}
.flow-card:nth-child(4){background:linear-gradient(145deg,#f6edff,#e5d4ff)}
.flow-card:nth-child(5){background:linear-gradient(145deg,#e2fbf8,#bfece6)}
.pill{box-shadow:inset 0 1px 0 #ffffffbd}
.example{box-shadow:0 16px 36px #123b4a1c;background:radial-gradient(circle at 100% 0,#267e87 0,transparent 36%),linear-gradient(135deg,#112c47,#174e61)}
.topic-header{box-shadow:0 15px 30px #123b4a20;background:radial-gradient(circle at 88% 10%,#4f9a9a88,transparent 32%),linear-gradient(120deg,#112c47,#1d6976)}
.resource{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.resource:hover{transform:translateY(-3px);box-shadow:0 12px 25px #123b4a12;border-color:#a4d8d3}
.quiz-option{transition:background .18s ease,border-color .18s ease,transform .18s ease}
.quiz-option:hover{transform:translateX(3px);background:linear-gradient(90deg,#f0fffa,#fff)}
.searchbox:focus{outline:3px solid #7ddbd080;border-color:#2d8b88}
.hero{box-shadow:0 18px 45px #112c471c}
.hero .btn.secondary{background:#f8fbff}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

@media(max-width:950px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:30;left:0;top:66px;width:280px;transform:translateX(-102%);transition:transform .2s;height:calc(100vh - 66px);box-shadow:12px 0 40px #123b4a22}.layout.nav-open aside{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:66px 0 0;background:#102b4666;z-index:25}.content{padding:16px}.flow{grid-template-columns:1fr}.flow-card{min-height:0;display:grid;grid-template-columns:35px 35px 1fr;align-items:center;gap:10px}.flow-card:not(:last-child):after{content:"↓";right:auto;left:48%;top:auto;bottom:-20px}.flow-card h3{margin:0}.flow-card p{grid-column:3}.example-steps{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.grid,.grid.two,.resource-list{grid-template-columns:1fr}.topbar{padding:10px}.brand{font-size:13px}.hero{padding:23px}.hero p{font-size:15px}.example-steps{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.content{padding:12px}}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button>
  <div class="brandmark">⚗️</div>
  <div class="brand">TEACHER AUS<small>SCIENCE LAB · EXPLORE • EXPERIMENT • EXCEL</small></div>
  <div class="top-actions"><button class="menu-btn" id="searchBtn" aria-label="Search">⌕</button></div>
</header>
<div class="mobile-overlay" id="overlay"></div>
<div class="layout" id="layout">
<aside id="sidebar">
  <div class="nav-label">Learning portal</div>
  <button class="nav-item active" data-page="home">🏠 <span>Home</span></button>
  <button class="nav-item" data-page="curriculum">📘 <span>Standard-Based Curriculum Design</span></button>
  <div class="nav-label">Explore by year</div>
  <div id="yearNav"></div>
  <div class="nav-label">Learning resources</div>
  <button class="nav-item" data-page="videos">🎬 <span>Science Videos</span></button>
  <button class="nav-item" data-page="lab">🧪 <span>Science Lab</span></button>
  <button class="nav-item" data-page="quiz">🎮 <span>Quiz Zone</span></button>
  <button class="nav-item" data-page="uasa">🏆 <span>UASA Practice</span></button>
  <button class="nav-item" data-page="resources">📚 <span>Resource Centre</span></button>
  <button class="nav-item" data-page="about">👩‍🏫 <span>About Teacher Aus</span></button>
</aside>
<main class="content" id="mainContent"></main>
</div>
<footer class="footer">TEACHER AUS SCIENCE LAB · A learning space for curious young scientists.<br><span>Prototype content: verify all learning standards against the applicable KSSR Science DSKP before classroom use.</span></footer>
<script>
const categories=[
 {name:"Inquiry in Science",icon:"🔎",desc:"Scientific skills, questions, observations and investigations."},
 {name:"Life Science",icon:"🌿",desc:"Living things, life processes and relationships."},
 {name:"Physical Science",icon:"⚡",desc:"Energy, forces and physical phenomena."},
 {name:"Material Science",icon:"🧪",desc:"Properties, uses and changes of materials."},
 {name:"Earth and Space",icon:"🌍",desc:"Earth, weather, the Solar System and space."},
 {name:"Technology and Sustainability",icon:"🛠️",desc:"Technology, design and responsible use of resources."}
];
const years=[1,2,3,4,5,6];
let currentPage="home", currentYear=5, currentCategory=3, searchOpen=false;
const $=s=>document.querySelector(s);
const yearNav=$("#yearNav");
years.forEach(y=>{
 const wrap=document.createElement("div");
 wrap.innerHTML=`<button class="year-toggle" data-year="${y}"><span>📂</span><span>Year ${y}</span><span class="chev">⌄</span></button><div class="subnav" id="subnav-${y}">${categories.map((c,i)=>`<button data-year="${y}" data-cat="${i}" data-page="topic">${c.icon} ${c.name}</button>`).join("")}</div>`;
 yearNav.appendChild(wrap);
});
function go(page,opts={}){
 currentPage=page;
 if(opts.year)currentYear=Number(opts.year);
 if(opts.cat!==undefined)currentCategory=Number(opts.cat);
 document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 document.querySelectorAll(".subnav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page&&Number(b.dataset.year)===currentYear&&Number(b.dataset.cat)===currentCategory));
 if(page==="topic")$("#subnav-"+currentYear).classList.add("open");
 render(); closeMobileNav(); window.scrollTo({top:0,behavior:"smooth"});
}
function closeMobileNav(){ $("#layout").classList.remove("nav-open");$("#overlay").classList.remove("show");}
$("#menuBtn").addEventListener("click",()=>{$("#layout").classList.toggle("nav-open");$("#overlay").classList.toggle("show")});
$("#overlay").addEventListener("click",closeMobileNav);
document.body.addEventListener("click",e=>{
 const yr=e.target.closest("[data-year]:not([data-cat])");
 if(yr){const n=yr.dataset.year;$("#subnav-"+n).classList.toggle("open");return}
 const topic=e.target.closest("[data-cat]");
 if(topic){go("topic",{year:topic.dataset.year,cat:topic.dataset.cat});return}
 const page=e.target.closest("[data-page]");
 if(page){go(page.dataset.page);return}
 const action=e.target.closest("[data-action]");
 if(action){const a=action.dataset.action;if(a==="open-year")go("year",{year:action.dataset.year});if(a==="curriculum")go("curriculum");if(a==="quiz")go("quiz");if(a==="lab")go("lab");if(a==="uasa")go("uasa");if(a==="resources")go("resources");if(a==="videos")go("videos");}
});
$("#searchBtn").addEventListener("click",()=>{searchOpen=!searchOpen;const old=$("#siteSearch");if(old)old.remove();if(searchOpen){const inp=document.createElement("input");inp.id="siteSearch";inp.className="searchbox";inp.placeholder="Search topics and resources...";$("#mainContent").prepend(inp);inp.focus();inp.addEventListener("input",()=>{const q=inp.value.toLowerCase();document.querySelectorAll(".searchable").forEach(el=>el.classList.toggle("hidden",!el.innerText.toLowerCase().includes(q)))})}});
function shellHero(kicker,title,subtitle,desc=""){return `<div class="topic-header"><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${subtitle}</p>${desc?`<p>${desc}</p>`:""}</div>`}
function home(){return `
<section class="hero">
 <span class="eyebrow">🔬 Growing as young scientists</span>
 <h1>Welcome, <span style="color:#d9f99d">Young Scientists!</span></h1>

<section class="section"><div class="section-head"><div><h2>How Curriculum Becomes Learning</h2><p>Explore the connected stages of curriculum planning and classroom practice.</p></div></div>
<div class="flow">${[
["01","🎯","Curriculum Standards","Identify the Content Standard and Learning Standard."],
["02","📝","Learning Objectives","Translate standards into clear, observable learning intentions."],
["03","🔬","Teaching & Learning","Plan inquiry, discussion, practical work and meaningful experiences."],
["04","📋","Assessment Evidence","Gather evidence through observation, questioning, tasks and pupil work."],
["05","🏆","Performance & Feedback","Interpret progress using the relevant Performance Standard and plan next steps."]
].map(x=>`<article class="flow-card"><span class="num">${x[0]}</span><span class="flow-icon">${x[1]}</span><div><h3>${x[2]}</h3><p>${x[3]}</p></div></article>`).join("")}</div></section>
<section class="section"><div class="section-head"><div><h2>Explore the DSKP</h2><p>Select a component to learn how it supports effective science teaching.</p></div></div>
<div class="grid">${[
["🎯","Content Standard","Broad knowledge, skills and values pupils are expected to acquire.","The Content Standard establishes the overall direction for learning."],
["📝","Learning Standard","Specific learning expectations that clarify what pupils should learn or demonstrate.","Use the exact wording and code from the applicable year-specific DSKP."],
["🧭","Learning Objectives","Clear lesson-level intentions aligned with the selected Learning Standard.","Objectives should be specific, observable and suitable for the pupils."],
["🔬","Teaching & Learning","Inquiry, investigations, discussion, modelling and hands-on experiences.","Choose activities that allow pupils to practise the intended knowledge and skills."],
["📋","Assessment Evidence","Observations, questioning, practical work, explanations, quizzes and pupil products.","Evidence should match the learning intention, not just task completion."],
["🏆","Performance Standard","Descriptors used to consider pupils' demonstrated level of mastery.","Use the official descriptor for the relevant Learning Standard; do not substitute Bloom labels."]

<section class="section"><div class="example"><span class="pill">FROM DOCUMENT TO CLASSROOM</span><h2>Through the Teacher's Lens</h2><div class="example-steps"><div class="example-step"><b>01 · PLAN</b>Identify standards, objectives, success criteria and resources.</div><div class="example-step"><b>02 · FACILITATE</b>Engage pupils in inquiry, investigation and discussion.</div><div class="example-step"><b>03 · ASSESS</b>Collect evidence and provide feedback during learning.</div><div class="example-step"><b>04 · RESPOND</b>Adapt support, reteach where needed and extend learning.</div></div></div></section>
<section class="section"><div class="section-head"><div><h2>Applied Example: Rusting Investigation</h2><p>A sample of how curriculum planning can become classroom practice.</p></div></div><div class="grid two">
<article class="card"><span class="pill">LEARNING DESIGN</span><h3>Investigation question</h3><p>What conditions are needed for an iron object to rust?</p><h3>Learning experience</h3><p>Pupils compare carefully prepared iron-nail setups, observe changes over time and record evidence in a table. The teacher should select a safe, curriculum-aligned procedure.</p></article>
<article class="card"><span class="pill">EVIDENCE & FEEDBACK</span><h3>Evidence to collect</h3><p>Observation table, identification of variables where appropriate, explanation of results and a conclusion supported by evidence.</p><h3>Teacher response</h3><p>Use pupil explanations to identify misconceptions and plan a follow-up question or activity.</p></article>
</div></section>

<div class="grid two"><article class="card"><span class="pill">SAMPLE ACTIVITY</span><h3>Rusting Investigation</h3><p><b>Question:</b> What conditions are associated with rusting of iron?</p><p><b>Plan:</b> Compare teacher-prepared setups, keep the comparison fair, observe over time and record visible changes.</p><p><b>Record:</b> Date, setup, observation and conclusion supported by evidence.</p><p><b>Safety:</b> Use clean materials under teacher supervision. Do not taste materials; wash hands after the activity and follow school laboratory rules.</p></article><article class="card"><span class="pill">INVESTIGATION TEMPLATE</span><h3>My Science Report</h3><label for="investigation">Investigation question</label><input id="investigation" class="searchbox" placeholder="What do I want to find out?"><label for="prediction">My prediction</label><textarea id="prediction" class="searchbox" rows="2" placeholder="I predict that..."></textarea><label for="observation">My observation</label><textarea id="observation" class="searchbox" rows="3" placeholder="I observed that..."></textarea><button class="btn" onclick="makeReport()">Create report text</button><div id="reportOutput" class="note hidden"></div></article></div>`}
function quiz(){return `${shellHero("THINK · CHOOSE · LEARN","Quiz Zone","Quick science challenge","Answer each question and read the feedback to strengthen your understanding.")}
<div class="card" id="quizCard"><span class="pill" id="quizCount">QUESTION 1 OF 5</span><h2 id="quizQuestion">Loading question...</h2><div id="quizOptions"></div><div id="quizFeedback" class="quiz-feedback" aria-live="polite"></div><div class="btn-row"><button class="btn" id="nextQuestion" disabled>Next question →</button><button class="btn secondary" id="restartQuiz">Restart</button></div><p id="quizScore" class="pill hidden"></p></div>
<div class="note">This is a short sample quiz on general primary science concepts, not an official UASA paper. Replace or extend it using the learning standards taught.</div>`}
const questions=[
 {q:"Which tool is most suitable for measuring the temperature of water?",o:["Thermometer","Stopwatch","Measuring cylinder","Balance"],a:0,why:"A thermometer measures temperature, commonly in degrees Celsius."},
 {q:"Which state of matter has a fixed volume but takes the shape of its container?",o:["Solid","Liquid","Gas","All three"],a:1,why:"A liquid has a fixed volume but changes shape to fit its container."},
 {q:"Which action is an example of observing?",o:["Recording the colour of a leaf","Guessing without evidence","Changing every variable","Copying a friend's result"],a:0,why:"Observation involves gathering information using the senses or suitable instruments."},
 {q:"Which two conditions are generally needed for iron to rust?",o:["Sunlight and soil","Oil and heat","Oxygen and water or moisture","Plastic and air only"],a:2,why:"Rusting of iron generally requires oxygen and water or moisture."},
 {q:"Why should a scientist record results in a table?",o:["To hide unexpected results","To organise and compare data clearly","To make the experiment longer","To avoid making observations"],a:1,why:"Tables organise data so patterns and comparisons are easier to identify."}
];
let qIndex=0,score=0,answered=false;
function initQuiz(){qIndex=0;score=0;answered=false;drawQuestion()}
function drawQuestion(){const q=questions[qIndex];$("#quizCount").textContent=`QUESTION ${qIndex+1} OF ${questions.length}`;$("#quizQuestion").textContent=q.q;$("#quizOptions").innerHTML=q.o.map((o,i)=>`<button class="quiz-option" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("");$("#quizFeedback").textContent="";$("#nextQuestion").disabled=true;$("#nextQuestion").textContent=qIndex===questions.length-1?"See my result →":"Next question →";$("#quizScore").classList.add("hidden");answered=false}
document.addEventListener("click",e=>{const opt=e.target.closest("[data-answer]");if(opt&&currentPage==="quiz"&&!answered){answered=true;const q=questions[qIndex],a=Number(opt.dataset.answer);if(a===q.a)score++;document.querySelectorAll("[data-answer]").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.style.borderColor="#16a34a";if(i===a&&a!==q.a)b.style.borderColor="#dc2626"});$("#quizFeedback").textContent=(a===q.a?"Well done! ":"Not quite. ")+q.why;$("#nextQuestion").disabled=false;}});
document.addEventListener("click",e=>{if(e.target.id==="nextQuestion"&&currentPage==="quiz"&&answered){if(qIndex<questions.length-1){qIndex++;drawQuestion()}else{$("#quizQuestion").textContent=`You scored ${score} out of ${questions.length}!`;$("#quizOptions").innerHTML="";$("#quizFeedback").textContent=score===questions.length?"Excellent work, young scientist!":"Good effort. Review the explanations and try again.";$("#nextQuestion").disabled=true;$("#quizScore").textContent=`FINAL SCORE: ${score}/${questions.length}`;$("#quizScore").classList.remove("hidden")}}if(e.target.id==="restartQuiz")initQuiz()});

<div class="grid two"><article class="card"><div class="iconbox">🧠</div><h3>Answering strategy</h3><ol><li>Read the question carefully.</li><li>Underline important words.</li><li>Identify what the question asks.</li><li>Use scientific terms accurately.</li><li>Check your answer against the evidence or data provided.</li></ol></article><article class="card"><div class="iconbox">📝</div><h3>Practice set planner</h3><p>Create separate practice sets by year, topic and question type. Include objective questions, structured responses, data interpretation and investigation skills.</p><p><b>Teacher reminder:</b> label teacher-created questions as practice materials, not official examination papers.</p><button class="btn" data-action="quiz">Try the sample quiz →</button></article></div><section class="section"><h2>Suggested revision routine</h2><div class="grid"><article class="card"><h3>1. Review</h3><p>Read notes and key vocabulary.</p></article><article class="card"><h3>2. Practise</h3><p>Answer questions without looking at the notes.</p></article><article class="card"><h3>3. Reflect</h3><p>Check answers, correct errors and revisit difficult concepts.</p></article></div></section>`}

<div class="grid two"><article class="card"><div class="iconbox">👩‍🏫</div><h3>Our learning philosophy</h3><p>Science learning grows through curiosity, observation, questioning, investigation, evidence and reflection.</p></article><article class="card"><div class="iconbox">🌟</div><h3>Our mission</h3><p>To make science approachable, meaningful and engaging through clear explanations and active learning.</p></article></div><section class="section"><h2>How to use this site</h2><ol><li>Choose your year level.</li><li>Open a science domain.</li><li>Read the notes and watch the selected video.</li><li>Complete the activity or worksheet.</li><li>Take a quiz and review the feedback.</li></ol></section><div class="note">Personalise this page with the teacher's preferred introduction, school details and contact information before publishing. Avoid displaying pupils' personal information publicly.</div>`}
