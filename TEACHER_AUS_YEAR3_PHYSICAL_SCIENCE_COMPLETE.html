arning area"><option value="">All learning areas</option></select><button id="expand">Expand All</button><button id="collapse">Collapse All</button></section><div id="results"></div><section class="sheet"><h2>Original Year 3 Physical Science Sheet</h2><p>Use the interactive curriculum cards above, or refer to the source spreadsheet below.</p><p><a href="https://docs.google.com/spreadsheets/d/1u9ewv9uWQ1iCaJzn07TAGKEFe-CrdYWScVTg_yqSaJU/edit" target="_blank" rel="noopener">Open Year 3 Google Sheet</a></p><iframe loading="lazy" title="Physical Science Year 3 Google Sheet" src="https://docs.google.com/spreadsheets/d/1u9ewv9uWQ1iCaJzn07TAGKEFe-CrdYWScVTg_yqSaJU/preview"></iframe></section><footer>Teacher Aus · Physical Science Year 3</footer></main><script>const data=[{"name": "Measurement", "standards": [{"name": "6.1 Measurement of area and volume", "learning": [{"name": "6.1.1 State the units that are used to measure area and volume.", "performance": ["PL 1 - State the units that are used to measure area and volume"]}, {"name": "6.1.2 Measure the area of regular surfaces using 1cm x 1cm square", "performance": ["PL 2 - Describe the methods of measuring area and volume.", "PL3 – Measure area and volume."]}, {"name": "6.1.3 Solve problems to estimate the area of irregular surfaces.", "performance": ["PL1-Identify irregular surfaces", "PL 2-Describe the method used to estimate the area of irregular surfaces", "PL 3- Estimate the area of irregular surfaces using square units", "PL 4-Solve problems to estimate the area of irregular surfaces."]}, {"name": "6.1.4 Measure the volume of hollow boxes using 1cm x 1cm x 1cm cubes.", "performance": ["PL 1- Identify the materials and tools used to measure the volume of hallow boxes and liquids."]}, {"name": "6.1.5 Measure the volume of liquid using correct tools and techniques.", "performance": ["PL 2- Describe the methods of measuring the volume of hallow boxes \nusing 1 cm x 1cm x1cm cubes and liquids using correct tools and techniques.", "PL 3-Measure area and volume"]}, {"name": "6.1.6 Solve problems to determine the volume of irregular \nshaped solids using water displacement method.", "performance": ["PL1 - Identify the apparatus used to determine the volume  of irregular \nshaped solids using the water displacement method.", "PL2 - Describe the water displacement method used to  determine the \nvolume of irregular shaped solids.", "PL3 - Demonstrate the water displacement method to determine the\n volume of irregular shaped solids.", "PL4 - Compare the initial and final water levels to determine the volume of \nirregular shaped solids.", "PL5 – Solve problems to determine the volume of irregular shaped solids."]}, {"name": "6.1.7 Explain the result of observations about the measurement of area and volume through written or verbal forms, sketches or ICT in a creative way.", "performance": ["PL1 - Identify the units used to measure area and volume.", "PL2 - Describe the methods used to measure area and volume.", "PL3 - Measure area and volume using appropriate units and methods.", "PL4 - Explain the results of measurements of area and volume based on observations.", "PL5 - Justify the results of measurements of area and volume based on observations.", "PL6 – Give reasons on the importance of measurement in daily life."]}]}]}, {"name": "Density", "standards": [{"name": "7.1 Objects or materials which are more or less \ndense than water.", "learning": [{"name": "7.1.1 Make inferences about objects or materials that float or sink by carrying out activities.", "performance": ["PL1 - State the objects or materials that float and the objects or materials that sink.", "PL2 - Make inferences about objects or materials that float and objects or materials that sink."]}, {"name": "7.1.2 Relate objects or materials that float and objects or materials that sink with density.", "performance": ["PL3 - Make generalisation on objects or materials that are more or less dense than water."]}, {"name": "7.1.3 Solve problems to identify methods to make water more dense.", "performance": ["PL1 - State the materials (such as salt or sugar) that can be used to make water more dense.", "PL2 - Explain the correct process of adding and dissolving the materials into the water.", "PL3 - Demonstrate the steps of dissolving materials to observe the changes in water density.", "PL4 - Conclude the ways to make water more dense.", "PL5 - Apply the knowledge on density by carrying out projects or activities."]}, {"name": "7.1.4 Explain the result of observations about object or materials which are more or less dense through written or verbal forms, sketches or ICT in a creative way.", "performance": ["PL6 - Communicate about the applications of density in life in a creative and innovative way."]}]}]}];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('area').innerHTML+=[...data].map(a=>'<option value="'+esc(a.name)+'">'+esc(a.name)+'</option>').join('');$('pills').innerHTML=data.map(a=>'<span class="pill">'+esc(a.name)+'</span>').join('');function render(){let q=$('search').value.toLowerCase().trim(),filter=$('area').value;let output='';for(const a of data){if(filter&&filter!==a.name)continue;for(const st of a.standards){let ls=st.learning.filter(l=>!q||[a.name,st.name,l.name,...l.performance].join(' ').toLowerCase().includes(q));if(!ls.length)continue;output+='<article class="standard"><header><div class="tag">'+esc(a.name)+' · Content Standard</div><h2>'+esc(st.name)+'</h2></header>'+ls.map(l=>'<details class="learning"><summary>'+esc(l.name)+'</summary><div class="detail"><h3>Performance Standards / Descriptors</h3>'+l.performance.map(p=>'<div class="pl">'+esc(p)+'</div>').join('')+'</div></details>').join('')+'</article>'}}$('results').innerHTML=output||'<div class="empty">No matching learning standards found.</div>'} $('search').addEventListener('input',render);$('area').addE
